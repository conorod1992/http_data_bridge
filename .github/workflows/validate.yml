name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall -q custom_components/http_data_bridge

  ha-contracts:
    name: HA contracts (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.8.0"
            pytest_ha: "0.13.354"
          - homeassistant: "2026.9.1"
            pytest_ha: "0.13.364"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test environment
        run: >-
          python -m pip install
          "pytest-homeassistant-custom-component==${{ matrix.pytest_ha }}"
      - name: Run Home Assistant integration contracts
        run: >-
          python -m pytest -q tests_ha
          -o asyncio_mode=auto
          -o asyncio_default_fixture_loop_scope=function

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # hacs/action currently fetches integration manifests from unauthenticated
    # raw.githubusercontent.com URLs and therefore cannot validate private repos.
    # This job becomes active automatically if the repository is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
